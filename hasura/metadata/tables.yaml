- table:
    schema: public
    name: organizations
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: org_members
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflows
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

- table:
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id

- table:
    schema: public
    name: workflows
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: workflow_steps
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_steps
    - name: workflow_triggers
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_triggers
    - name: workflow_runs
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_runs
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        check:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
        columns:
          - org_id
          - name
          - description
          - created_by
  update_permissions:
    - role: user
      permission:
        columns:
          - name
          - description
          - updated_at
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id

