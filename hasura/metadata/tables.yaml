- table:
    schema: public
    name: org_usage_monthly
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          org_id:
            _in:
              _select:
                table:
                  schema: public
                  name: org_members
                columns:
                  - org_id
                where:
                  user_id:
                    _eq: X-Hasura-User-Id
